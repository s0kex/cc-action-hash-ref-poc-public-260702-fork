name: Claude Hash Ref E2E PoC (write collaborator, no allowed_non_write_users)

# Auxiliary variant: no allowed_non_write_users at all. The PR is opened by a
# collaborator that already has write permission. This shows that the ref
# confusion bug is NOT caused by allowed_non_write_users. Even in a fully
# "supported" write-capable workflow, a branch name containing "#" causes
# the action to write to a different base ref than the PR head branch.
#
# The action's own FAQ documents that Claude will only push to the branch
# it was invoked on, or its own generated branch. This variant demonstrates
# that guarantee is broken at the GitHub API URL construction layer,
# regardless of allowed_non_write_users.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  e2e:
    if: contains(github.event.pull_request.head.ref, 'writecollab')
    runs-on: ubuntu-latest

    timeout-minutes: 10
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v6

      - name: Mark fake Claude executable
        run: chmod +x .github/fake-claude.mjs

      - name: Run vulnerable Claude Code Action path
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e
        with:
          prompt: "PoC: write e2e-action-marker.txt using commit signing."
          anthropic_api_key: "fake-key-not-used-by-fake-claude"
          github_token: ${{ github.token }}
          # No allowed_non_write_users. The PR author must have write access.
          use_commit_signing: true
          path_to_claude_code_executable: ${{ github.workspace }}/.github/fake-claude.mjs
          show_full_output: "true"
