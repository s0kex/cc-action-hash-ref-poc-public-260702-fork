name: Claude Hash Ref E2E PoC

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  e2e:
    if: ${{ contains(github.event.pull_request.head.ref, 'v2') }}
    
    timeout-minutes: 10
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v6

      - name: Mark fake Claude executable
        run: chmod +x .github/fake-claude.mjs

      - name: Run vulnerable Claude Code Action path
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e
        with:
          prompt: "PoC: write e2e-action-marker.txt using commit signing."
          anthropic_api_key: "fake-key-not-used-by-fake-claude"
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          use_commit_signing: true
          path_to_claude_code_executable: ${{ github.workspace }}/.github/fake-claude.mjs
          show_full_output: "true"
