name: Claude Hash Ref E2E PoC (specific-user variant)

# Variant of the primary E2E workflow that allows a single external user
# instead of "*". Demonstrates the vulnerability is not tied to
# allowed_non_write_users: "*". Any non-write actor named explicitly
# is enough to reach the vulnerable file-ops path.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  e2e:
    if: contains(github.event.pull_request.head.ref, 'specific')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout base repository
        uses: actions/checkout@v6

      - name: Mark fake Claude executable
        run: chmod +x .github/fake-claude.mjs

      - name: Run vulnerable Claude Code Action path
        uses: anthropics/claude-code-action@6c0083bb7289c31716797a039b6367b3079cc46e
        with:
          prompt: "PoC: write e2e-action-marker.txt using commit signing."
          anthropic_api_key: "fake-key-not-used-by-fake-claude"
          github_token: ${{ github.token }}
          # Explicit, single external user - not "*".
          allowed_non_write_users: "s0kex"
          use_commit_signing: true
          path_to_claude_code_executable: ${{ github.workspace }}/.github/fake-claude.mjs
          show_full_output: "true"
